<title>NocoDB dashboards</title>
<style>
  :root {
    --bg: #f4f5fb; --card: #ffffff; --fg: #141a2b; --muted: #5a6479; --line: #e2e5f0;
    --glow: rgba(67, 81, 232, .16); --shadow: 0 24px 60px -24px rgba(42, 30, 165, .28);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0f18; --card: #141926; --fg: #eef0f7; --muted: #98a2b8; --line: #252c3f;
      --glow: rgba(67, 81, 232, .28); --shadow: 0 24px 60px -24px rgba(0, 0, 0, .7);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--fg);
    background-image: radial-gradient(60rem 36rem at 50% 38%, var(--glow), transparent 70%);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%; max-width: 32rem; padding: 3rem 2.5rem 2.75rem; text-align: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow);
  }
  .logo { width: 88px; height: 88px; display: block; margin: 0 auto 1.75rem; }
  h1 {
    margin: 0 0 .75rem; font-size: clamp(1.4rem, 4.5vw, 1.75rem); line-height: 1.25;
    letter-spacing: -.01em; text-wrap: balance;
  }
  p { margin: 0; color: var(--muted); font-size: 1.0625rem; text-wrap: balance; }
</style>
