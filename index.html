<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NocoDB dashboards</title>
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --fg: #1b2230; --muted: #5b6577; --line: #dfe3ea; --accent: #2b5fd9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f131a; --card: #171c26; --fg: #e8ebf1; --muted: #9aa4b5; --line: #262d3a; --accent: #7aa2ff; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main {
    width: 100%; max-width: 30rem; padding: 2rem 2rem 1.75rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  }
  svg { width: 40px; height: 40px; color: var(--accent); }
  h1 { margin: 1rem 0 .5rem; font-size: 1.25rem; line-height: 1.3; text-wrap: balance; }
  p { margin: 0; color: var(--muted); }
  p + p { margin-top: .75rem; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="4.5" y="10.5" width="15" height="10" rx="2"/>
    <path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
  </svg>
  <h1>Access to this dashboard is behind a secure VPN now.</h1>
  <p>Request access from the NocoDB admin.</p>
</main>
</body>
</html>
